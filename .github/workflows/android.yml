
name: Build LIXXZY Agent and Controller APKs

"on":
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both APKs
        working-directory: android
        run: gradle assembleAgentDebug assembleControllerDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LIXXZY-Agent-and-Controller-APKs
          path: |
            android/app/build/outputs/apk/agent/debug/app-agent-debug.apk
            android/app/build/outputs/apk/controller/debug/app-controller-debug.apk
