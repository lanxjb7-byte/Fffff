name: Build LIXXZY Agent and Controller APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both APKs
        working-directory: android
        run: gradle assembleAgentDebug assembleControllerDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LIXXZY-Agent-and-Controller-APKs
          path: |
            android/app/build/outputs/apk/agent/debug/app-agent-debug.apk
            android/app/build/outputs/apk/controller/debug/app-controller-debug.apk
            
